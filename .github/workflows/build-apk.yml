name: Build debug APK

# This sandbox can't reach dl.google.com, so the Android Gradle Plugin / SDK can't resolve
# there. GitHub-hosted runners ship the Android SDK preinstalled and have unrestricted
# network access, so this is where the app actually gets compiled and verified.
on:
  push:
    branches:
      - claude/android-weather-nexrad-app-pq98g5
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run nexrad-core unit tests
        run: ./gradlew :nexrad-core:test --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexradwx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
